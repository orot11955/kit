name: Verify

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  check-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.23.x'

      - name: Check
        shell: bash
        run: make check

      - name: Privileged activator integration
        shell: bash
        run: |
          sudo env \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_OS="$RUNNER_OS" \
            bash deploy/tests/activate-integration.sh

  check-macos-arm64:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.23.x'

      - name: Verify Apple Silicon runtime
        shell: bash
        run: |
          test "$(go env GOOS)" = "darwin"
          test "$(go env GOARCH)" = "arm64"
          test "$(uname -m)" = "arm64"

      - name: Check Go runtime
        shell: bash
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/kit ./cmd/kit
          /tmp/kit version --json
