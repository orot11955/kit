name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  check:
    runs-on: kit-ci
    steps:
      - name: Checkout
        uses: https://gitea.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify runner tools
        shell: bash
        run: |
          set -Eeuo pipefail
          go version
          [[ "$(go env GOVERSION)" =~ ^go([0-9]+)\.([0-9]+) ]]
          (( BASH_REMATCH[1] > 1 || (BASH_REMATCH[1] == 1 && BASH_REMATCH[2] >= 23) ))
          git --version
          bash --version | head -n 1

      - name: Check
        shell: bash
        run: make check
