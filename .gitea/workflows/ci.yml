name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  check:
    # 현재 등록된 Gitea Runner의 검증된 label
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: https://gitea.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: https://gitea.com/actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.23.x'

      - name: Verify runner tools
        shell: bash
        run: |
          set -Eeuo pipefail
          go version
          [[ "$(go env GOVERSION)" =~ ^go([0-9]+)\.([0-9]+) ]]
          (( BASH_REMATCH[1] > 1 || (BASH_REMATCH[1] == 1 && BASH_REMATCH[2] >= 23) ))
          git --version
          bash --version | head -n 1

      - name: Check
        shell: bash
        run: make check
