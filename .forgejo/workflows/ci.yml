name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify runner tools
        shell: bash
        run: |
          set -Eeuo pipefail
          go version
          [[ "$(go env GOVERSION)" =~ ^go([0-9]+)\.([0-9]+) ]]
          (( BASH_REMATCH[1] > 1 || (BASH_REMATCH[1] == 1 && BASH_REMATCH[2] >= 23) ))
          git --version
          bash --version | head -n 1

      - name: Check
        shell: bash
        run: make check
