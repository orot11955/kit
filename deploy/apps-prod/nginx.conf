worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name kit.2juho.com;

        root /srv/kit/current-site;
        index index.html;
        autoindex off;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = / {
            try_files /index.html =404;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        location = /index.html {
            try_files /index.html =404;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        location = /styles.css {
            try_files /styles.css =404;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        location = /app.js {
            try_files /app.js =404;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        location = /favicon.svg {
            try_files /favicon.svg =404;
            add_header Cache-Control "public, max-age=3600" always;
        }

        location = /install.sh {
            try_files /install.sh =404;
            default_type text/plain;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /version.txt {
            alias /srv/kit/current-release/version.txt;
            default_type text/plain;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /release.json {
            alias /srv/kit/current-release/release.json;
            default_type application/json;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location ~ ^/downloads/(?<kit_version>v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))/(?<kit_binary>kit_darwin_arm64|kit_linux_amd64)$ {
            alias /srv/kit/releases/$kit_version/$kit_binary;
            default_type application/octet-stream;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Content-Disposition "attachment; filename=$kit_binary" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location ~ ^/downloads/(?<kit_version>v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))/checksums\.txt$ {
            alias /srv/kit/releases/$kit_version/checksums.txt;
            default_type text/plain;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Content-Disposition "attachment; filename=checksums.txt" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /downloads/ {
            return 404;
        }

        location ~ (^|/)\. {
            return 404;
        }

        location / {
            return 404;
        }
    }
}
